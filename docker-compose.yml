# wayline local development stack.
#
# Two opt-in topologies driven by the WAYLINE_PROFILE environment variable
# / `--profile` flag, plus the bare default.
#
# Default (no profile): just Postgres on loopback. Fastest iteration loop;
# the wayline binary runs from the host with `go run ./cmd/wayline ...`.
#
#   docker compose up -d postgres
#   export WAYLINE_DATABASE_URL=postgres://wayline:wayline@localhost:5432/wayline?sslmode=disable
#   go run ./cmd/wayline migrate
#   go run ./cmd/wayline tokens create --root
#   go run ./cmd/wayline api
#
# Profile "app": Postgres + wayline-migrate + wayline (the API in a
# container). Use this when another project on the same host needs to
# integrate against a stable, always-on endpoint.
#
#   docker compose --profile app up -d
#
# Profile "production": Postgres + wayline + caddy (TLS terminator). Use
# this on a real host with a real DNS name.
#
#   WAYLINE_HOSTNAME=wayline.example.com \
#     docker compose --profile production up -d
#
# Postgres always binds to 127.0.0.1 to keep it off the public network.
# `wayline` binds to 127.0.0.1:8080 by default; production traffic is
# expected to enter through the caddy service, which terminates TLS.

services:
  postgres:
    image: postgres:16-alpine
    container_name: wayline-postgres
    environment:
      POSTGRES_USER: wayline
      POSTGRES_PASSWORD: wayline
      POSTGRES_DB: wayline
    ports:
      # Bound to loopback only. Production runs Postgres on the same host as
      # the wayline binary with no public listener (see spec: Security
      # Primitives).
      - "127.0.0.1:5432:5432"
    volumes:
      - wayline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayline -d wayline"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot init container. Applies all pending migrations and exits.
  # `service_completed_successfully` lets the long-running wayline service
  # gate on a clean migration before it accepts traffic.
  wayline-migrate:
    profiles: ["app", "production"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${WAYLINE_VERSION:-dev}
    image: wayline:${WAYLINE_VERSION:-dev}
    container_name: wayline-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WAYLINE_DATABASE_URL: postgres://wayline:wayline@postgres:5432/wayline?sslmode=disable
    command: ["migrate"]
    restart: "no"

  wayline:
    profiles: ["app", "production"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${WAYLINE_VERSION:-dev}
    image: wayline:${WAYLINE_VERSION:-dev}
    container_name: wayline-api
    depends_on:
      postgres:
        condition: service_healthy
      wayline-migrate:
        condition: service_completed_successfully
    environment:
      WAYLINE_DATABASE_URL: postgres://wayline:wayline@postgres:5432/wayline?sslmode=disable
      WAYLINE_HTTP_ADDR: ":8080"
    ports:
      # Loopback only by default. The "production" profile fronts this
      # with caddy on :443, which is the only port that should ever be
      # public-facing.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    # The runtime image is distroless: no curl, no shell. We ship the
    # probe as a wayline subcommand so the binary that already lives in
    # the container can answer "is /readyz green?" without any extra
    # tooling. start_period gives migrations + first listen a window
    # before unhealthy is reported.
    healthcheck:
      test: ["CMD", "/wayline", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # TLS terminator for the production topology. Caddy fetches a Let's
  # Encrypt certificate for ${WAYLINE_HOSTNAME} on first start and
  # renews it automatically. For local-only experimentation, leave this
  # service stopped and talk to wayline:8080 directly.
  caddy:
    profiles: ["production"]
    image: caddy:2-alpine
    container_name: wayline-caddy
    depends_on:
      wayline:
        condition: service_healthy
    environment:
      WAYLINE_HOSTNAME: ${WAYLINE_HOSTNAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  wayline-pgdata:
  caddy-data:
  caddy-config:
